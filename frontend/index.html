<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Help Desk - Submit Ticket</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎫 HR Help Desk</h1>
            <nav>
                <a href="index.html" class="active">Submit Ticket</a>
                <a href="dashboard.html">View Dashboard</a>
            </nav>
        </header>

        <main>
            <div class="card">
                <h2>Submit a New Help Desk Ticket</h2>
                <p class="subtitle">Fill out the form below to submit your request to the HR team.</p>

                <form id="ticketForm">
                    <div class="form-group">
                        <label for="employee_name">Your Name *</label>
                        <input type="text" id="employee_name" name="employee_name" required>
                    </div>

                    <div class="form-group">
                        <label for="employee_email">Email Address *</label>
                        <input type="email" id="employee_email" name="employee_email" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Category *</label>
                            <select id="category" name="category" required>
                                <option value="">Select a category</option>
                                <option value="Benefits">Benefits</option>
                                <option value="Payroll">Payroll</option>
                                <option value="Time Off">Time Off</option>
                                <option value="Onboarding">Onboarding</option>
                                <option value="General">General</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="priority">Priority *</label>
                            <select id="priority" name="priority" required>
                                <option value="">Select priority</option>
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                                <option value="Urgent">Urgent</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject/Title *</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description *</label>
                        <textarea id="description" name="description" rows="6" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Submit Ticket</button>
                        <button type="reset" class="btn btn-secondary">Clear Form</button>
                    </div>
                </form>

                <div id="message" class="message hidden"></div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 HR Help Desk. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Handle form submission
        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                const result = await createTicket(data);
                if (result.success) {
                    showMessage('Ticket submitted successfully! Redirecting to dashboard...', 'success');
                    e.target.reset();
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } else {
                    showMessage('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('Error submitting ticket: ' + error.message, 'error');
            }
        });

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.classList.remove('hidden');
            
            if (type === 'success') {
                setTimeout(() => {
                    messageEl.classList.add('hidden');
                }, 3000);
            }
        }
    </script>
</body>
</html>
