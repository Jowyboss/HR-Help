<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Help Desk - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎫 HR Help Desk</h1>
            <nav>
                <a href="index.html">Submit Ticket</a>
                <a href="dashboard.html" class="active">View Dashboard</a>
            </nav>
        </header>

        <main>
            <!-- Server Status Indicator -->
            <div id="serverStatus" class="message hidden"></div>
            
            <div class="dashboard">
                <div class="dashboard-header">
                    <h2>Ticket Dashboard</h2>
                    <button onclick="location.reload()" class="btn btn-secondary">
                        🔄 Refresh
                    </button>
                </div>

                <!-- Stats Cards -->
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalTickets">0</div>
                        <div class="stat-label">Total Tickets</div>
                    </div>
                    <div class="stat-card stat-open">
                        <div class="stat-value" id="openTickets">0</div>
                        <div class="stat-label">Open</div>
                    </div>
                    <div class="stat-card stat-progress">
                        <div class="stat-value" id="inProgressTickets">0</div>
                        <div class="stat-label">In Progress</div>
                    </div>
                    <div class="stat-card stat-resolved">
                        <div class="stat-value" id="resolvedTickets">0</div>
                        <div class="stat-label">Resolved</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filters-card">
                    <h3>🔍 Filters & Search</h3>
                    <div class="filters-grid">
                        <div class="form-group">
                            <label for="filterStatus">Status</label>
                            <select id="filterStatus" onchange="applyFilters()">
                                <option value="">All Statuses</option>
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Resolved">Resolved</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="filterCategory">Category</label>
                            <select id="filterCategory" onchange="applyFilters()">
                                <option value="">All Categories</option>
                                <option value="Benefits">Benefits</option>
                                <option value="Payroll">Payroll</option>
                                <option value="Time Off">Time Off</option>
                                <option value="Onboarding">Onboarding</option>
                                <option value="General">General</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="filterPriority">Priority</label>
                            <select id="filterPriority" onchange="applyFilters()">
                                <option value="">All Priorities</option>
                                <option value="Urgent">Urgent</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="searchInput">Search</label>
                            <input type="text" id="searchInput" placeholder="Search tickets..." 
                                   onkeyup="handleSearch()" />
                        </div>

                        <div class="form-group">
                            <label for="sortBy">Sort By</label>
                            <select id="sortBy" onchange="applyFilters()">
                                <option value="created_at">Date Created</option>
                                <option value="updated_at">Last Updated</option>
                                <option value="priority">Priority</option>
                                <option value="status">Status</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="sortOrder">Order</label>
                            <select id="sortOrder" onchange="applyFilters()">
                                <option value="desc">Descending</option>
                                <option value="asc">Ascending</option>
                            </select>
                        </div>
                    </div>

                    <div class="filter-actions">
                        <button onclick="clearFilters()" class="btn btn-secondary">Clear Filters</button>
                    </div>
                </div>

                <!-- Tickets Table -->
                <div class="card">
                    <div class="tickets-header">
                        <h3>All Tickets</h3>
                        <span id="ticketCount" class="ticket-count">0 tickets</span>
                    </div>
                    
                    <div id="loadingMessage" class="loading">Loading tickets...</div>
                    <div id="errorMessage" class="message error hidden"></div>
                    
                    <div class="table-responsive">
                        <table id="ticketsTable" class="tickets-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Subject</th>
                                    <th>Employee</th>
                                    <th>Category</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Assigned To</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ticketsTableBody">
                                <!-- Tickets will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 HR Help Desk. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
    <script>
        let allTickets = [];
        let searchTimeout = null;

        // Load tickets on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await checkConnection();
            await loadDashboard();
        });
        
        // Check server connection
        async function checkConnection() {
            const statusEl = document.getElementById('serverStatus');
            const isConnected = await checkServerConnection();
            
            if (!isConnected) {
                statusEl.innerHTML = `
                    <strong>⚠️ Backend Server Not Running</strong><br>
                    Cannot load tickets. Please start the backend server.<br>
                    Run: <code>cd backend && python app.py</code> or use <code>./start.sh</code>
                `;
                statusEl.className = 'message error';
                statusEl.classList.remove('hidden');
            }
        }

        async function loadDashboard() {
            try {
                // Load stats
                const stats = await getStats();
                displayStats(stats);

                // Load tickets
                await applyFilters();
            } catch (error) {
                showError('Error loading dashboard: ' + error.message);
            }
        }

        function displayStats(stats) {
            if (stats && stats.by_status) {
                document.getElementById('totalTickets').textContent = stats.total_tickets || 0;
                document.getElementById('openTickets').textContent = stats.by_status.open || 0;
                document.getElementById('inProgressTickets').textContent = stats.by_status.in_progress || 0;
                document.getElementById('resolvedTickets').textContent = stats.by_status.resolved || 0;
            }
        }

        async function applyFilters() {
            const filters = {
                status: document.getElementById('filterStatus').value,
                category: document.getElementById('filterCategory').value,
                priority: document.getElementById('filterPriority').value,
                search: document.getElementById('searchInput').value,
                sort_by: document.getElementById('sortBy').value,
                sort_order: document.getElementById('sortOrder').value
            };

            try {
                document.getElementById('loadingMessage').style.display = 'block';
                const tickets = await getTickets(filters);
                allTickets = tickets;
                displayTickets(tickets);
                document.getElementById('loadingMessage').style.display = 'none';
            } catch (error) {
                document.getElementById('loadingMessage').style.display = 'none';
                showError('Error loading tickets: ' + error.message);
            }
        }

        function handleSearch() {
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }
            searchTimeout = setTimeout(() => {
                applyFilters();
            }, 500);
        }

        function clearFilters() {
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterPriority').value = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('sortBy').value = 'created_at';
            document.getElementById('sortOrder').value = 'desc';
            applyFilters();
        }

        function displayTickets(tickets) {
            const tbody = document.getElementById('ticketsTableBody');
            document.getElementById('ticketCount').textContent = `${tickets.length} ticket${tickets.length !== 1 ? 's' : ''}`;

            if (tickets.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="no-data">No tickets found</td></tr>';
                return;
            }

            tbody.innerHTML = tickets.map(ticket => `
                <tr>
                    <td>#${ticket.id}</td>
                    <td class="ticket-subject">
                        <a href="ticket-detail.html?id=${ticket.id}">${escapeHtml(ticket.subject)}</a>
                    </td>
                    <td>${escapeHtml(ticket.employee_name)}</td>
                    <td><span class="badge badge-category">${ticket.category}</span></td>
                    <td><span class="badge badge-priority-${ticket.priority.toLowerCase()}">${ticket.priority}</span></td>
                    <td><span class="badge badge-status-${ticket.status.toLowerCase().replace(' ', '-')}">${ticket.status}</span></td>
                    <td>${ticket.assigned_to ? escapeHtml(ticket.assigned_to) : '<em class="unassigned">Unassigned</em>'}</td>
                    <td>${formatDate(ticket.created_at)}</td>
                    <td>
                        <a href="ticket-detail.html?id=${ticket.id}" class="btn-small">View</a>
                    </td>
                </tr>
            `).join('');
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }
    </script>
</body>
</html>
